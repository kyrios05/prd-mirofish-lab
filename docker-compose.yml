version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - MIROFISH_BASE_URL=http://host.docker.internal:5001
      - MIROFISH_MODE=live
    env_file:
      - ./apps/api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/app:/app/app
      - ./PRD_SCHEMA.json:/app/PRD_SCHEMA.json
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
