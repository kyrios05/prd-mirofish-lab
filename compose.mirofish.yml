# Apply after ../MiroFish-Offline/docker-compose.yml; see scripts/mirofish-up.sh.
# Credentials are read from apps/api/.env at runtime and never stored here.
services:
  mirofish:
    # CAMEL's pinned psutil dependency needs a compiler on Linux ARM64.
    # Keep the engine source as the build context inherited from its Compose file.
    build:
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates python3 python3-venv python3-dev gcc \
          && rm -rf /var/lib/apt/lists/*
        COPY --from=ghcr.io/astral-sh/uv:0.9.26 /uv /uvx /bin/
        WORKDIR /app
        COPY package.json package-lock.json ./
        COPY frontend/package.json frontend/package-lock.json ./frontend/
        COPY backend/pyproject.toml backend/uv.lock ./backend/
        RUN npm ci && npm ci --prefix frontend && cd backend && uv sync --frozen
        COPY . .
        EXPOSE 3000 5001
        CMD ["npm", "run", "dev"]
    environment:
      LLM_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in apps/api/.env}
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL_NAME: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in apps/api/.env}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      LLM_BOOST_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in apps/api/.env}
      LLM_BOOST_BASE_URL: https://api.openai.com/v1
      LLM_BOOST_MODEL_NAME: ${OPENAI_MODEL:-gpt-5.6-terra}
